<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>umm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 흑백 전용. 색은 오직 회색 단계로만 쓴다. */
:root {
  --bg: #0a0a0a;
  --panel: #101010;
  --raise: #161616;
  --line: #242424;
  --line-strong: #3a3a3a;
  --text: #d6d6d6;
  --muted: #7c7c7c;
  --dim: #555555;
  --white: #f5f5f5;
  --code: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --fs: 14px;
  --lh: 22px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--ui); font-size: 14px;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
button, select, input, textarea { font: inherit; color: inherit; }
button {
  background: transparent; border: 1px solid var(--line-strong); border-radius: 6px;
  padding: 6px 12px; cursor: pointer; white-space: nowrap;
}
button:hover { border-color: var(--muted); background: var(--raise); }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 1px solid var(--white); outline-offset: 2px; }
.primary { background: var(--white); color: #000; border-color: var(--white); font-weight: 600; }
.primary:hover { background: #ffffff; color: #000; }
select { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 8px; }
kbd { font-family: var(--code); font-size: 11px; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; }

/* top bar */
.bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--code); font-weight: 600; font-size: 18px; color: var(--white); letter-spacing: -0.02em; margin-right: 6px; }
.brand span { color: var(--dim); font-weight: 400; }
.bar .grow { flex: 1; }
.hint { color: var(--muted); font-size: 12px; }

/* main split */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.pane + .pane { border-left: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); }
.tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 6px 10px 8px; color: var(--muted); }
.tab:hover { background: transparent; color: var(--text); }
.tab[aria-selected="true"] { color: var(--white); border-bottom-color: var(--white); }
.tabpanel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.tabpanel[hidden] { display: none; }

/* editor */
.editor { position: relative; flex: 1; min-height: 0; display: flex; overflow: hidden; background: var(--bg); }
.gutter {
  font-family: var(--code); font-size: var(--fs); line-height: var(--lh); color: var(--dim);
  text-align: right; padding: 12px 10px 12px 12px; user-select: none; overflow: hidden; min-width: 48px;
  border-right: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: pre;
}
.gutter .err { color: var(--bg); background: var(--white); border-radius: 3px; }
.code { position: relative; flex: 1; min-width: 0; overflow: hidden; }
.code pre, .code textarea {
  position: absolute; inset: 0; margin: 0; padding: 12px 14px; border: 0;
  font-family: var(--code); font-size: var(--fs); line-height: var(--lh); tab-size: 2;
  white-space: pre; overflow: auto; letter-spacing: 0;
}
.code pre { pointer-events: none; color: var(--text); }
.code textarea {
  background: transparent; color: transparent; caret-color: var(--white); resize: none; outline: none;
  -webkit-text-fill-color: transparent;
}
.code textarea::selection { background: rgba(255,255,255,0.18); }
.h-com { color: #5c5c5c; font-style: italic; }
.h-str { color: #9b9b9b; }
.h-num { color: #e8e8e8; }
.h-bi { color: #ffffff; text-decoration: underline; text-decoration-color: #4a4a4a; text-underline-offset: 3px; }
.h-sym { color: #ffffff; font-weight: 600; }
.h-id { color: #c4c4c4; }

/* autocomplete */
.ac {
  position: absolute; z-index: 5; min-width: 260px; max-width: 420px; max-height: 240px; overflow-y: auto;
  background: var(--raise); border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 0;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5); font-size: 13px;
}
.ac[hidden] { display: none; }
.ac-item { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 4px 10px; cursor: pointer; align-items: baseline; }
.ac-item b { font-family: var(--code); font-weight: 600; color: var(--white); }
.ac-item span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ac-item[aria-selected="true"] { background: #262626; }

/* io */
.io { flex: 1; min-height: 0; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.io label { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.io textarea, .out {
  flex: 1; min-height: 80px; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 10px 12px; font-family: var(--code); font-size: 13px; line-height: 20px; resize: none; overflow: auto; white-space: pre;
}
.out { margin: 0; }
.out.err { border-color: var(--line-strong); }
.out .errline { color: var(--white); font-weight: 600; }
.io-split { flex: 1; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1.4fr); gap: 12px; }
.io-split > div { min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row .grow { flex: 1; }
.meta { font-family: var(--code); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* status */
.status {
  display: flex; gap: 14px; align-items: center; min-height: 30px;
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px));
  border-top: 1px solid var(--line); font-size: 12px; color: var(--muted);
}
.status .msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status .msg.bad { color: var(--white); }

/* grammar sheet */
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,0.72); display: flex; justify-content: flex-end; }
.sheet[hidden] { display: none; }
.sheet-body {
  width: min(760px, 100%); height: 100%; background: var(--bg); border-left: 1px solid var(--line-strong);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.sheet-head { display: flex; gap: 10px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin: 0; font-size: 16px; font-weight: 600; color: var(--white); }
.sheet-head input { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 10px; }
.sheet-scroll { flex: 1; overflow-y: auto; padding: 4px 16px 32px; }
.sheet h3 { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin: 22px 0 6px; font-weight: 500; }
.gtable { width: 100%; border-collapse: collapse; }
.gtable td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.gtable td:first-child { color: var(--muted); width: 26%; font-size: 13px; }
.gtable td.dot { font-family: var(--code); color: var(--white); width: 34%; font-size: 13px; }
.gtable td.cpp { font-family: var(--code); color: var(--dim); font-size: 12px; }
.tablewrap { overflow-x: auto; }
.rules { color: var(--muted); font-size: 13px; line-height: 1.7; margin: 8px 0 0; padding-left: 18px; }
.rules code { font-family: var(--code); color: var(--white); }

@media (max-width: 860px) {
  body { height: auto; min-height: 100%; }
  .main { grid-template-columns: 1fr; }
  .pane + .pane { border-left: 0; border-top: 1px solid var(--line); }
  .editor { min-height: 52vh; }
  .io-split { min-height: 60vh; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>

<header class="bar">
  <div class="brand">umm</div>
  <div class="grow"></div>
  <button id="sheet-open" title="F1">문법</button>
  <button id="tocc" title="Ctrl+Shift+Enter">C 복사</button>
  <button class="primary" id="run" title="Ctrl+Enter">실행</button>
</header>

<main class="main">
  <section class="pane" aria-label="코드">
    <div class="editor">
      <div class="gutter" id="gutter" aria-hidden="true"></div>
      <div class="code" id="codebox">
        <pre id="hl" aria-hidden="true"></pre>
        <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="umm 코드"></textarea>
        <div class="ac" id="ac" role="listbox" hidden></div>
      </div>
    </div>
  </section>

  <section class="pane" aria-label="입출력">
    <div class="io">
      <div class="io-split">
        <div><label for="stdin">입력</label><textarea id="stdin" spellcheck="false"></textarea></div>
        <div>
          <div class="row"><label for="out" class="grow">출력</label><span class="meta" id="runmeta"></span></div>
          <pre class="out" id="out" tabindex="0"></pre>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="status">
  <span class="msg" id="status">준비 중…</span>
  <span class="meta" id="pos">1:1</span>
</footer>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-body" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title">문법표</h2>
      <input id="sheet-q" type="search" placeholder="찾기 (예: 정렬, for, Dj)" aria-label="문법표에서 찾기">
      <button id="sheet-close">닫기</button>
    </div>
    <div class="sheet-scroll" id="sheet-scroll"></div>
  </div>
</div>

    <li>대문자로 시작하면 내장 함수, 소문자는 내 이름. 예외로 <code>m</code>(최소) <code>g</code>(최소공배수)는 예약어.</li>
    <li>이름에는 숫자를 못 써요. 이름 뒤 숫자는 소수점 자리예요: <code>avg3...</code></li>
    <li>타입은 자동. 정수는 64비트, 정수끼리 <code>/</code> 는 몫.</li>
    <li>쉼표나 연산자로 끝난 줄은 다음 줄로 이어져요.</li>
  </ul>`;
  for (const [title, rows] of G) {
    const hit = rows.filter((r) => !q || r.join(" ").toLowerCase().includes(q) || title.includes(q));
    if (!hit.length) continue;
    html += `<h3>${esc(title)}</h3><div class="tablewrap"><table class="gtable">` +
      hit.map(([a, b, c]) => `<tr><td>${esc(a)}</td><td class="dot">${esc(b).replace(/\n/g, "<br>").replace(/ {2}/g, " &nbsp;")}</td><td class="cpp">${esc(c)}</td></tr>`).join("") +
      `</table></div>`;
  }

}
